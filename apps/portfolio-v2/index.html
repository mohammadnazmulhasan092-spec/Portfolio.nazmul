<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Portfolio — The Cinematic Future City</title>
<link rel="icon" id="favicon-link" href="data:," />
<meta name="description" content="A scroll-driven cinematic flight through a living future-city portfolio." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<a class="skip-link" href="#contact-panels">Skip cinematic intro, go to contact info</a>

<!-- ============ LOADING SCREEN ============ -->
<div id="loading-screen">
  <div class="loading-mark" id="loading-mark">ASSEMBLING THE CITY</div>
  <div class="loading-track"><div class="loading-fill" id="loading-fill"></div></div>
  <div class="loading-sub" id="loading-sub">Loading districts…</div>
</div>

<!-- ============ ZONE 0 — PRELUDE ============ -->
<div id="prelude" role="status">
  <div class="glyph" aria-hidden="true"><span></span></div>
  <p id="prelude-text">Scroll to Enter the City</p>
</div>

<!-- ============ PERSISTENT HUD ============ -->
<div id="hud" aria-hidden="true">
  <div id="hud-name">—</div>
  <div id="hud-zone">Cloudbank</div>
</div>
<div id="progress-rail" aria-hidden="true"><div id="progress-fill"></div></div>

<!-- ============ ACCESSIBILITY TOGGLE ============ -->
<button id="a11y-toggle" aria-pressed="false" title="Toggle reduced motion (discrete stops instead of continuous flight)">
  Reduced Motion: Off
</button>

<!-- ============ THE WORLD ============ -->
<canvas id="city-canvas" aria-hidden="true"></canvas>

<!-- ============ HOLOGRAPHIC INFORMATION LAYER ============
     Real HTML/CSS panels, positioned every frame from 3D world
     anchors projected to screen space (see script.js). This keeps
     every piece of content genuinely readable and accessible while
     still visually "existing" at a location in the world, per the
     architecture's Part 14 (holographic layer) + legibility rule. -->
<div class="holo-layer" id="holo-layer">

  <!-- Zone 3 — Headquarters: identity + About, folded into one display
       per the architecture's own resolved placement (Part 2, option a) -->
  <div class="holo-panel" id="panel-hq" data-anchor="hq">
    <p class="holo-kicker">Headquarters</p>
    <h3 id="hq-name">—</h3>
    <p id="hq-role"></p>
    <p id="hq-intro"></p>
  </div>

  <!-- Zone 4 — Boulevard: one panel per project, injected dynamically -->
  <div id="boulevard-panels"></div>

  <!-- Zone 5 — Tech Campus: one small label per skill icon, injected dynamically -->
  <div id="skill-labels"></div>

  <!-- Zone 6 — Learning Campus: one panel per education stage, injected dynamically -->
  <div id="education-panels"></div>

  <!-- Zone 7 — Museum: one panel per achievement, injected dynamically -->
  <div id="museum-panels"></div>

  <!-- Zone 8 — Communication Tower: contact channels -->
  <div class="holo-panel" id="panel-tower" data-anchor="tower" style="max-width:280px;">
    <p class="holo-kicker">Communication Tower</p>
    <h3>Let's talk</h3>
    <div id="contact-panels"></div>
  </div>

</div>

<div id="scroll-spacer" aria-hidden="true"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script type="module" src="script.js"></script>
</body>
</html>
