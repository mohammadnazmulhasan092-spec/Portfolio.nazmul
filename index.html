<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio</title>
  <meta name="robots" content="noindex" />
  <style>
    html,body{margin:0;height:100%;background:#000;display:flex;align-items:center;justify-content:center;
      font-family:monospace;color:#0f0;font-size:13px;letter-spacing:2px;}
  </style>
</head>
<body>
  <div id="msg">LOADING…</div>
  <script type="module">
    // Root entry point. Reads the single active_version setting and
    // redirects to whichever Portfolio version (V1 or V2) is currently
    // published. This file contains NO business logic itself — it only
    // consumes shared/api.js, so it never needs to change when a new
    // version is added beyond shared/api.js's PORTFOLIO_VERSIONS list.
    import { getActiveVersion, pathForVersion } from './shared/api.js';

    getActiveVersion()
      .then(v => { window.location.replace(pathForVersion('portfolio', v.version)); })
      .catch(() => { window.location.replace(pathForVersion('portfolio', 'v1')); });
  </script>
  <noscript>
    <p>JavaScript is required. <a href="/apps/portfolio-v1/index.html" style="color:#0f0;">Continue to the portfolio</a>.</p>
  </noscript>
</body>
</html>
