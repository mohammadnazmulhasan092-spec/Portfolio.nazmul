<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin</title>
  <meta name="robots" content="noindex" />
  <style>
    html,body{margin:0;height:100%;background:#000;display:flex;align-items:center;justify-content:center;
      font-family:monospace;color:#0f0;font-size:13px;letter-spacing:2px;}
  </style>
</head>
<body>
  <div id="msg">LOADING…</div>
  <script type="module">
    // Root admin entry point. Mirrors /index.html but for the admin
    // dashboard, and reads the SAME active_version setting — this is
    // what guarantees the public site and the admin dashboard always
    // switch together (single source of truth, one setting).
    import { getActiveVersion, pathForVersion } from '../shared/api.js';

    getActiveVersion()
      .then(v => { window.location.replace(pathForVersion('admin', v.version)); })
      .catch(() => { window.location.replace(pathForVersion('admin', 'v1')); });
  </script>
  <noscript>
    <p>JavaScript is required. <a href="/apps/admin-v1/admin.html" style="color:#0f0;">Continue to the admin panel</a>.</p>
  </noscript>
</body>
</html>
